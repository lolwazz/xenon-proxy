<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xenon</title>
<link rel="stylesheet" href="/browser.css">
</head>
<body>

<div id="boot">
  <h1>xenon</h1>
  <p id="bootmsg">starting</p>
  <button id="bootreset" hidden>Reset and retry</button>
</div>

<div id="shell" hidden>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs" style="display:flex;gap:2px"></div>
      <button id="newtab" title="New tab">+</button>
    </div>
    <div id="toolbar">
      <button class="nav" id="back" title="Back">&#8592;</button>
      <button class="nav" id="fwd" title="Forward">&#8594;</button>
      <button class="nav" id="reload" title="Reload">&#8635;</button>
      <div id="omni">
        <input id="url" type="text" spellcheck="false" placeholder="Search or enter URL">
      </div>
      <button class="nav" id="star" title="Bookmark this page">&#9734;</button>
      <select id="engine" title="Proxy engine">
        <option value="uv">Ultraviolet</option>
        <option value="scramjet">Scramjet</option>
      </select>
    </div>
    <div id="bookmarks"></div>
  </div>
  <div id="views"></div>
</div>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script src="/scram/scramjet.all.js"></script>
<script src="/baremux/index.js"></script>
<script src="/browser.js"></script>
</body>
</html>
